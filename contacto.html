<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - McLaren Fans</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
  <style>
    body { background:#111; color:white; }
    .navbar { background: linear-gradient(to right, #b30000, #000); }
    .contact {padding:60px 0;}
    footer {background:linear-gradient(to right,#111,#222,#000);text-align:center;padding:20px;margin-top:40px;}
    .social-icons a {margin:0 10px;color:white;transition:transform 0.3s;}
    .social-icons a:hover {color:#ff4d4d;transform:scale(1.2);}
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">McLaren Fans</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="galeria.html">Galería</a></li>
          <li class="nav-item"><a class="nav-link" href="planes.html">Planes</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contacto -->
  <section class="contact container">
    <h2 class="fw-bold text-danger text-center mb-5">Contáctanos</h2>
    <div class="row">
      <div class="col-md-6">
        <form>
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea class="form-control" rows="4" required></textarea>
          </div>
          <button type="submit" class="btn btn-danger">Enviar</button>
        </form>
      </div>
      <div class="col-md-6 d-flex flex-column justify-content-center">
        <h4>Información de contacto</h4>
        <p><i class="fas fa-map-marker-alt"></i> Liverpool, Inglaterra</p>
        <p><i class="fas fa-envelope"></i> contacto@mclarenfans.com</p>
        <p><i class="fas fa-phone"></i> +44 123 456 789</p>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <h5 class="fw-bold">
      <img src="https://cdn.freebiesupply.com/logos/large/2x/mclaren-1-logo-black-and-white.png" alt="McLaren Logo" style="height:130px;">
    </h5>
    <p>Pasión por los superdeportivos británicos</p>
    <div class="social-icons">
      <a href="#"><i class="fab fa-facebook fa-2x"></i></a>
      <a href="#"><i class="fab fa-instagram fa-2x"></i></a>
      <a href="#"><i class="fab fa-twitter fa-2x"></i></a>
      <a href="#"><i class="fab fa-youtube fa-2x"></i></a>
    </div>
    <p class="small mt-3">&copy; 2025 McLaren Fans - Todos los derechos reservados</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
